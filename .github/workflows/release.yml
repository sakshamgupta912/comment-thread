name: Publish package

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: validate
    if: vars.NPM_RELEASE_APPROVED == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Verify the release tag matches package.json
        run: node --input-type=module -e "import fs from 'node:fs'; const p = JSON.parse(fs.readFileSync('package.json', 'utf8')); if (process.env.GITHUB_REF_NAME !== 'v' + p.version) throw new Error('Tag and package version differ');"
      - run: npm publish --dry-run
      - run: npm publish --access public --provenance
